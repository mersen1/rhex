name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/ImageMagick-6/pkgconfig:/usr/lib/x86_64-linux-gnu/ImageMagick-7/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            libmagickwand-dev \
            fonts-dejavu-core

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.7
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rspec
